<div class="not-found-shell">
  <a class="not-found-brand" routerLink="/products">
    <img src="/logo.png" alt="Buy01" />
  </a>

  <main class="not-found-card">
    <p class="not-found-code" aria-hidden="true">404</p>
    <h1>We can't find that page.</h1>
    <p class="not-found-copy">
      The link may be out of date, or the page has moved. The catalog is a good place to start again.
    </p>

    <div class="not-found-actions">
      <a routerLink="/products" class="btn-primary">
        Go to the catalog
        <app-icon name="arrow-right" [size]="16"></app-icon>
      </a>
      <a routerLink="/seller" class="btn-light">
        <app-icon name="dashboard" [size]="16"></app-icon>
        Seller dashboard
      </a>
    </div>
  </main>
</div>
