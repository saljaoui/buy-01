<!-- toast.component.html -->
<div class="toast-container" role="status" aria-live="polite">

  @for (toast of toastService.toasts(); track toast.id) {

    <div class="toast" [class]="toast.type">

      <app-icon [name]="iconFor(toast.type)" [size]="18"></app-icon>

      <span>{{ toast.message }}</span>

      @if (toast.action; as action) {
        <a class="toast-action" [routerLink]="action.link" (click)="toastService.remove(toast.id)">{{ action.label }}</a>
      }

      <button type="button" (click)="toastService.remove(toast.id)" aria-label="Dismiss notification">
        <app-icon name="x" [size]="16"></app-icon>
      </button>

    </div>

  }

</div>
