services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root
    ports:
      - "8000:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci-network

volumes:
  jenkins_home:

networks:
  ci-network:
    external: true
