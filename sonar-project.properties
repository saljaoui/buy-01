# Project identity (must match the project created in SonarQube)
sonar.projectKey=buy-01
sonar.projectName=buy-01

# Source code: all backend services + frontend
sonar.sources=services,infrastructure,frontend/src
sonar.tests=services,infrastructure,frontend/src

# Separate real code from tests
sonar.exclusions=**/src/test/**,**/*.spec.ts,**/target/**,**/node_modules/**,**/test-results/**
sonar.test.inclusions=**/src/test/**,**/*.spec.ts

# Compiled Java classes (created by the Build stage)
sonar.java.binaries=services/*/target/classes,infrastructure/*/target/classes

sonar.sourceEncoding=UTF-8

# Coverage reports (created by the Test backend / Test frontend stages)
sonar.coverage.jacoco.xmlReportPaths=services/user-service/target/site/jacoco/jacoco.xml,services/product-service/target/site/jacoco/jacoco.xml,services/media-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/s/lcov.info

# No business logic here, so it is not counted in coverage
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/dto/**,**/model/**,frontend/src/main.ts,frontend/src/environments/**
